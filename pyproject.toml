[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-renamer"
version = "1.0.0"
description = "Automatically identify and rename MKV files from MakeMKV into Plex-ready folder structures"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "questionary>=2.0",
    "tmdbv3api>=1.9",
    "pymediainfo>=6.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
media-renamer = "media_renamer.cli:app"

[tool.setuptools.packages.find]
include = ["media_renamer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
